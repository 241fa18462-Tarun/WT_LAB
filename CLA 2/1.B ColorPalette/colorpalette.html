<!DOCTYPE html>
<html>

<head>

    <title>Color Palette</title>

    <style>

        body {
            font-family: Arial;
            text-align: center;
            background-color: lightgray;
            transition: 0.5s;
        }

        h1 {
            color: black;
            margin-top: 40px;
        }

        .palette {
            margin-top: 50px;
        }

        .color {
            width: 120px;
            height: 80px;

            display: inline-block;

            margin: 15px;

            padding-top: 30px;

            box-sizing: border-box;

            border-radius: 10px;

            color: white;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .color:hover {
            transform: scale(1.15);
            border: 4px solid white;
        }

    </style>

</head>


<body>

    <h1>&#127912; COLOR PALETTE</h1>

    <p>
        Move your mouse over a color
        to change the background
    </p>


    <div class="palette">


        <!-- RED -->

        <div
            class="color"
            style="background-color:red;"
            onmouseover="document.body.style.backgroundColor='red';">

            RED

        </div>


        <!-- GREEN -->

        <div
            class="color"
            style="background-color:green;"
            onmouseover="document.body.style.backgroundColor='green';">

            GREEN

        </div>


        <!-- BLUE -->

        <div
            class="color"
            style="background-color:blue;"
            onmouseover="document.body.style.backgroundColor='blue';">

            BLUE

        </div>


        <!-- YELLOW -->

        <div
            class="color"
            style="background-color:orange;"
            onmouseover="document.body.style.backgroundColor='orange';">

            ORANGE

        </div>


        <!-- PURPLE -->

        <div
            class="color"
            style="background-color:purple;"
            onmouseover="document.body.style.backgroundColor='purple';">

            PURPLE

        </div>


        <!-- PINK -->

        <div
            class="color"
            style="background-color:deeppink;"
            onmouseover="document.body.style.backgroundColor='deeppink';">

            PINK

        </div>


    </div>


</body>

</html>
